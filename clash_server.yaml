  - {name: 自动测速,       <<: *BaseUT, include-all: true, filter: *FilterAL, icon: https://testingcf.jsdelivr.net/gh/gogyt/Qure@master/IconSet/Color/Auto.png}        # 默认用它:每 300s 全量测速,自动切到延迟最低的节点
  - {name: 故障转移,       <<: *BaseFB, include-all: true, filter: *FilterAL, icon: https://testingcf.jsdelivr.net/gh/gogyt/Qure@master/IconSet/Color/Back.png}        # 不看延迟,按订阅顺序选第一个可用的,适合需要固定出口
  - {name: 手动切换,       <<: *BaseHS, include-all: true, filter: *FilterAL, icon: https://testingcf.jsdelivr.net/gh/gogyt/Qure@master/IconSet/Color/World_Map.png}   # 自己在面板上挑节点

# 4 规则路由 (按照从上往下的顺序遍历,相互隶属的规则按"金字塔"模式排序实现分流,优先命中上位规则,规则重复无影响,修改顺序会影响分流效果,如geolocation-!cn为境外域名,包含了前置gfw被墙域名,先滤掉gfw被墙域名后，剩下的就是未被墙的境外域名)
rules:
  # 4.1 拦截规则(按需启用,可禁用拦截,不影响使用效果)
  - GEOSITE,category-ads-all,REJECT                          # 轻量化广告拦截列表,搭配AWAvenueAds秋风广告列表使用,同时禁用adblock广告过滤列表
  - RULE-SET,AWAvenueAds,REJECT                              # 秋风广告过滤列表,搭配category-ads-all广告列表使用,同时禁用adblock广告过滤列表
  - RULE-SET,adblock,REJECT                                  # adblock广告过滤列表,与秋风、category-ads-all广告列表单独使用

  # 4.2 域名规则
  - GEOSITE,private,直接连接                                  # 私有域名
  - GEOIP,private,直接连接,no-resolve                         # 内网 / 保留 IP(127/8、192.168/16…)
  - RULE-SET,My_Direct,直接连接                               # 自定义直连域名
  - RULE-SET,Direct_0,直接连接                                # 漏网之鱼Direct列表
  - RULE-SET,Custom_Direct_Domain,直接连接                    # 自定义直连域名
  - GEOSITE,category-game-platforms-download,直接连接         # 游戏平台下载
  - GEOSITE,category-public-tracker,直接连接                  # BT Tracker
  - GEOSITE,category-pt,直接连接                              # PT站
  - GEOSITE,category-games@cn,直接连接                        # 国内游戏
  - GEOSITE,category-games-cn,直接连接                        # 国区游戏平台
  - GEOSITE,google-cn,直接连接                                # Google中国服务
  - GEOSITE,apple@cn,直接连接                                 # 苹果中国
  - GEOSITE,bing@cn,直接连接                                  # bing中国
  - GEOSITE,microsoft@cn,直接连接                             # 微软中国
  - GEOSITE,bing,Bing(Copilot)                               # bing (含copilot,category-ai-!cn中也含了copilot,在使用edge浏览器时,后台会启用copilot产生流量,需要时开启代理)
  - GEOSITE,github,Github                                    # GitHub(属Microsoft的子集,置其前才能分流)
  - GEOSITE,apple,苹果服务                                    # 苹果服务
  - RULE-SET,Speedtest,网络测试                               # 测速工具
  - GEOSITE,category-speedtest,网络测试                       # 测速工具
  - GEOSITE,test-ipv6,网络测试                                # 测速工具
  - GEOSITE,category-ai-!cn,AI服务                           # AI服务(国外AI兜底,含openai、gemini、copilot、claude、grok等)
  - GEOSITE,youtube,油管视频                                  # YouTube
  - GEOSITE,tiktok,TikTok                                    # TikTok
  - GEOSITE,netflix,奈飞视频                                  # Netflix
  - GEOSITE,disney,迪士尼+                                    # Disney+
  - GEOSITE,hbo,HBO                                          # HBO
  - GEOSITE,primevideo,Prime Video                           # Prime Video
  - GEOSITE,category-emby,Emby                               # Emby
  - GEOSITE,spotify,Spotify                                  # Spotify
  - GEOSITE,google,谷歌服务                                   # Google服务
  - GEOSITE,category-games,游戏平台                           # 游戏平台(含category-games-cn、Steam)
  - GEOSITE,category-communication,即时通讯                   # 即时通讯(含telegram、WhatsApp、clubhouse等,若需精简,可以将注释掉"3.1 业务策略组"中相应的分组)
  - GEOSITE,category-social-media-!cn,社交媒体                # 国外社交媒体(含instagram、facebook、twitter、mixi等,若需精简,可以将注释掉"3.1 业务策略组"中相应的分组)
  - GEOSITE,category-entertainment,国外娱乐                   # 国外娱乐(含youtube、tiktok、bahamut、primevideo、netflix、disney、apple-tvplus、hbo、category-games-!cn、tmdb、imdb等,若需精简,可以注释掉5.3相应的规则及"3.1 业务策略组"中对应的分组,最终到此规则兜底)
  - GEOSITE,category-ecommerce,国外电商                       # 国外电商
  - GEOSITE,category-cryptocurrency,加密货币                  # 加密货币(大部分在gfw中)
  - GEOSITE,gfw,默认代理                                      # GFW列表(主要规则,被墙列表)
  - GEOSITE,microsoft,微软服务                                # 微软服务
  - GEOIP,telegram,即时通讯,no-resolve                        # Telegram IP
  - GEOIP,twitter,社交媒体,no-resolve                         # Twitter IP
  - GEOIP,facebook,社交媒体,no-resolve                        # Facebook IP
  - GEOIP,google,谷歌服务,no-resolve                          # Google IP
  - GEOIP,netflix,奈飞视频,no-resolve                         # Netflix IP
  - GEOSITE,geolocation-!cn,默认直连                          # 非中国域名(本条主要是境外域名,涵盖gfw被墙域名,其余几乎未被墙,前面gfw滤掉了被墙域名,这里默认直连,视连接情况切换代理)
  - GEOIP,cloudflare,默认直连,no-resolve                      # cloudflare(geolocation-!cn已包含cloudflare,这里IP补充)
  - GEOIP,cloudfront,默认直连,no-resolve                      # 亚马逊旗下CDN(同上IP补充)
 # - GEOIP,fastly,默认直连,no-resolve                          # FSLY CDN(同上IP补充，注：有的代理软件默认GEO数据中缺少GEOIP,fastly数据，可尝试启用)
  - GEOSITE,cn,直接连接                                       # 中国域名
  - GEOIP,cn,直接连接,no-resolve                              # 中国IP
  - RULE-SET,non_standard_port,直接连接                       # 非标端口
  - MATCH,漏网之鱼                                            # 漏网之鱼

